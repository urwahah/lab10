name: Tests
on: push

jobs:
  test:
    runs-on: ubuntu-latest
	strategy:
      matrix:
        seed: [1, 2, 3, 159]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pytest
      - name: Run tests
        run: python -m pytest
	  - name: Estimate pi with seed ${{ matrix.seed }}
        run: python -c "from darts import estimate_pi; print(estimate_pi(seed=${{ matrix.seed }}))"